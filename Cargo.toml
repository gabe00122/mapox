[workspace]
members = ["crates/mapox-core", "crates/mapox-py", "crates/mapox-web", "crates/mapox-burn"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gabe00122/mapox"
authors = ["Gabriel Keith <gfk1995@gmail.com>"]

[profile.release]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
[workspace.dependencies]
mapox-core = { path = "crates/mapox-core" }
# default-features off at the workspace level so a member can decide: cargo
# refuses `default-features = false` on an inherited dependency, so this is the
# only place the choice can be made. mapox-web re-enables autotune through its
# own default feature.
mapox-burn = { path = "crates/mapox-burn", default-features = false }
log = "0.4"

# Core
fastnoise-lite = "1.1.1"
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng"] }
rayon = "1.12.0"
ndarray = { version = "0.17.2", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Python
pyo3 = "0.29.0"
numpy = "0.29.0"

# UI
eframe = { version="0.35.0", default-features = false, features = ["wayland", "wgpu_no_default_features"] }
wgpu = { version = "*", features = ["webgpu", "vulkan"] }
egui = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# WEB
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1.7"
