[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "mapox"
description = "Multi-Agent Partially Observable gridworlds in JAX"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]
license = { file = "LICENSE" }
authors = [
    { name = "Gabriel Keith", email = "gfk1995@gmail.com" }
]
keywords = ["reinforcement-learning", "jax", "multi-agent", "gridworld", "pomdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "einops>=0.8.1",
    "jax>=0.9",
    "pydantic>=2.12.5",
    "pygame-ce>=2.5.6",
    "python-ffmpeg>=2.0.12",
]

[project.urls]
Homepage = "https://github.com/gabe00122/mapox"
Repository = "https://github.com/gabe00122/mapox"
Issues = "https://github.com/gabe00122/mapox/issues"

[tool.maturin]
manifest-path = "crates/mapox-py/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "mapox._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
