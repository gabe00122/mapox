<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mapox</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: black;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!--
      miniquad's JS glue (macroquad sits on miniquad; this is not macroquad's),
      vendored byte-for-byte from the miniquad crate's own js/gl.js. It shares
      an ABI with the wasm, so scripts/build-web.sh re-copies it from whatever
      version Cargo.lock resolved on every build -- don't edit it by hand, and
      don't swap it for the CDN copy at not-fl3.github.io, which is older and
      is missing GL imports this binary needs.
    -->
    <script src="./mq_js_bundle.js"></script>
    <script>
      // `plugins` is a global from the bundle; `on_init` fires after the module
      // is instantiated and before `main()`, so `wasm_exports` is ready here.
      plugins.push({
        name: "mapox",
        version: 1,
        register_plugin: () => {},
        on_init: () => {
          const version = UTF8ToString(
            wasm_exports.version_ptr(),
            wasm_exports.version_len(),
          );
          console.log("mapox version:", version);
        },
      });

      load("./mapox-web-demo.wasm");
    </script>
  </body>
</html>
