<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mapox</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }
      /* The canvas is sized by CSS; eframe only sets the backing-store
         resolution (CSS size x DPR). Leaving the CSS size off instead makes
         the element grow to its backing size and feedback-loop bigger on
         every ResizeObserver delivery. */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="mapox-canvas"></canvas>
    <!--
      mapox_web.js and mapox_web_bg.wasm are generated in lockstep by the
      wasm-bindgen CLI (scripts/build_web.py) -- don't edit or pin them by hand.
    -->
    <script type="module">
      import init, { start, version } from "./mapox_web.js";
      await init();
      console.log("mapox version:", version());
      await start(document.getElementById("mapox-canvas"));
    </script>
  </body>
</html>
