[package]
name = "mapox-web"
description = "WebAssembly bindings for mapox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# miniquad (under macroquad) ships its own JS glue and instantiates the module
# itself, so this is a plain wasm binary built by `cargo build --target
# wasm32-unknown-unknown` -- not a wasm-bindgen cdylib. See scripts/build_web.py.
[[bin]]
name = "mapox-web-demo"
path = "src/bin/demo.rs"

[dependencies]
mapox-core.workspace = true
