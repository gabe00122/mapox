[package]
name = "mapox-web"
description = "WebAssembly bindings for mapox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A wasm-bindgen cdylib: `cargo build --target wasm32-unknown-unknown` then the
# wasm-bindgen CLI generates the JS module the page imports. See
# scripts/build_web.py. The rlib is only there so native `cargo check
# --workspace` has a target to build (the lib body is cfg'd to wasm anyway).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mapox-core.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true
log.workspace = true
